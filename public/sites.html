<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charcos | Parchar</title>
    <link rel="stylesheet" href="/styles.css?v=121" />
    <script src="/theme.js?v=109" defer></script>
  </head>
  <body class="theme-body list-body">
    <div class="ambient-glow"></div>
    <main class="app-shell">
      <header class="top-strip inner-top">
        <a class="icon-ghost icon-link" href="/" aria-label="Volver"><img src="/assets/ui/arrow-left.svg" alt="" /></a>
        <h1 id="site-page-title">Charcos</h1>
        <a class="icon-ghost icon-link" href="/social.html" aria-label="Muro"><img src="/assets/ui/message-circle.svg" alt="" /></a>
      </header>

      <p id="site-page-subtitle" class="subtitle">
        Charcos, miradores, pueblos, rutas y eventos para ordenar por cercania.
      </p>

      <form id="site-search-form" class="search-bar compact-search" role="search">
        <button class="search-submit" type="submit" aria-label="Buscar sitio">
          <img src="/assets/ui/search.svg" alt="" />
        </button>
        <input
          id="site-search"
          type="search"
          name="q"
          placeholder="Buscar charco, mirador, pueblo o evento"
          autocomplete="off"
        />
      </form>

      <section class="zone-picker" aria-label="Buscar sitios por zona">
        <label>
          Consultar desde sector o municipio
          <select id="site-zone-select">
            <option value="">Cerca de mi ubicacion</option>
          </select>
        </label>
        <button id="site-zone-apply" type="button" class="ghost-btn">
          Consultar zona
        </button>
        <p id="site-zone-status" class="status-muted"></p>
      </section>

      <section class="category-chips" aria-label="Filtros de sitios">
        <button type="button" class="chip-filter site-filter active" data-site-filter="todos">
          Todos
        </button>
        <button type="button" class="chip-filter site-filter" data-site-filter="charco">
          Charcos
        </button>
        <button type="button" class="chip-filter site-filter" data-site-filter="mirador">
          Miradores
        </button>
        <button type="button" class="chip-filter site-filter" data-site-filter="pueblo">
          Pueblos
        </button>
        <button type="button" class="chip-filter site-filter" data-site-filter="naturaleza">
          Naturaleza
        </button>
      </section>

      <div class="site-location-tools">
        <p id="site-location-status" class="status-muted">
          Permite ubicacion para ordenar por cercania.
        </p>
        <button id="site-location-btn" type="button" class="ghost-btn">
          Usar mi ubicacion
        </button>
      </div>

      <section id="site-results" class="cards-grid"></section>

      <nav class="bottom-nav public-nav">
        <a class="nav-item" href="/">
          <img src="/assets/ui/map-pin.svg" alt="" />
          <strong>Inicio</strong>
        </a>
        <a class="nav-item active" href="/sites.html?type=charco">
          <span id="site-nav-icon"><img src="/assets/ui/waves.svg" alt="" /></span>
          <strong id="site-nav-label">Charcos</strong>
        </a>
        <button type="button" class="nav-item nav-button" data-open-ad-request>
          <img src="/assets/ui/megaphone.svg" alt="" />
          <strong>Pautar</strong>
        </button>
        <a class="nav-item" href="/admin.html">
          <img src="/assets/ui/shield.svg" alt="" />
          <strong>Admin</strong>
        </a>
      </nav>

      <aside class="ad-banner" aria-label="Publicidad">
        <span class="ad-pill">Anuncio</span>
        <p>Espacio para aliados de Parchar</p>
        <button type="button" class="ad-cta">Anunciar</button>
      </aside>
    </main>

    <script src="/ads.js?v=116"></script>
    <script src="/update.js?v=93"></script>
    <script src="/trends.js?v=2"></script>
    <script src="/sites.js?v=98"></script>
  </body>
</html>
