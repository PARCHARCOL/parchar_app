<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locales | Parchar</title>
    <link rel="stylesheet" href="/styles.css?v=93" />
  </head>
  <body class="theme-body list-body">
    <div class="ambient-glow"></div>
    <main class="app-shell">
      <header class="top-strip inner-top">
        <a class="icon-ghost icon-link" href="/" aria-label="Volver">&#8592;</a>
        <h1 id="category-title">Locales</h1>
        <a class="icon-ghost icon-link" href="/clients.html" aria-label="Perfil">&#128100;</a>
      </header>

      <p id="category-subtitle" class="subtitle"></p>
      <section class="category-chips">
        <a href="/places.html?category=restaurante" class="chip-filter">Restaurantes</a>
        <a href="/places.html?category=bar" class="chip-filter">Bares</a>
        <a href="/places.html?mode=walking" class="chip-filter">A pie</a>
      </section>

      <section class="zone-picker" aria-label="Buscar por zona">
        <label>
          Buscar por sector o municipio
          <select id="zone-select">
            <option value="">Cerca de mi ubicacion</option>
          </select>
        </label>
        <button id="zone-apply" type="button" class="ghost-btn">
          Consultar zona
        </button>
        <p id="coverage-status" class="status-muted"></p>
      </section>

      <section id="results" class="cards-grid"></section>

      <nav class="bottom-nav public-nav">
        <a class="nav-item" href="/">
          <span>&#128205;</span>
          <strong>Inicio</strong>
        </a>
        <a class="nav-item active" href="/places.html?category=restaurante">
          <span>&#127860;</span>
          <strong>Restaurantes</strong>
        </a>
        <button type="button" class="nav-item nav-button" data-open-ad-request>
          <span>&#128227;</span>
          <strong>Pautar</strong>
        </button>
        <a class="nav-item" href="/admin.html">
          <span>&#128737;</span>
          <strong>Admin</strong>
        </a>
      </nav>

      <aside class="ad-banner" aria-label="Publicidad">
        <span class="ad-pill">Anuncio</span>
        <p>Espacio para aliados de Parchar</p>
        <button type="button" class="ad-cta">Anunciar</button>
      </aside>
    </main>

    <script src="/ads.js?v=93"></script>
    <script src="/update.js?v=93"></script>
    <script src="/places.js?v=93"></script>
  </body>
</html>
