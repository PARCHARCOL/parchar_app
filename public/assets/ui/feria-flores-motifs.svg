<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="papel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffef78"/><stop offset=".5" stop-color="#ff6cad"/><stop offset="1" stop-color="#44e2cc"/>
    </linearGradient>
    <radialGradient id="petal"><stop stop-color="#fff8b1"/><stop offset=".55" stop-color="#ff76c8"/><stop offset="1" stop-color="#d3268b"/></radialGradient>
    <g id="flower" stroke="#fff4d0" stroke-width="1.5">
      <ellipse cx="0" cy="-8" rx="4" ry="7" fill="url(#petal)"/>
      <ellipse cx="0" cy="-8" rx="4" ry="7" fill="url(#petal)" transform="rotate(60)"/>
      <ellipse cx="0" cy="-8" rx="4" ry="7" fill="url(#petal)" transform="rotate(120)"/>
      <ellipse cx="0" cy="-8" rx="4" ry="7" fill="url(#petal)" transform="rotate(180)"/>
      <ellipse cx="0" cy="-8" rx="4" ry="7" fill="url(#petal)" transform="rotate(240)"/>
      <ellipse cx="0" cy="-8" rx="4" ry="7" fill="url(#petal)" transform="rotate(300)"/>
      <circle r="3.2" fill="#ffd83d" stroke="#fff4a6"/>
    </g>
  </defs>

  <!-- Guirnalda de feria con banderines de papel picado -->
  <path d="M4 17C50 2 151 3 196 18" stroke="#174c38" stroke-width="4" stroke-linecap="round"/>
  <path d="M13 15 17 31l8-13 9 16 8-16 10 17 8-17 10 17 8-17 10 17 8-17 10 17 8-17 10 17 8-16 9 15 9-14" fill="url(#papel)" stroke="#fff5ce" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="m20 18 2 7m23-7 3 7m24-8 2 7m24-8 1 7m24-7-1 7m24-6-2 7m23-5-3 7m23-3-3 6" stroke="#a72879" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="15" cy="37" r="2.5" fill="#ffe151"/><circle cx="185" cy="36" r="2.5" fill="#66ffe0"/>

  <!-- Flores grandes a los lados y silletas de flores en las esquinas -->
  <g opacity=".98">
