<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3d146d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parchar" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/api/brand/app-icon" />
    <title>Parchar</title>
    <style>
      :root {
        --bg-1: #140228;
        --bg-2: #2a0b4d;
        --line: #ff8a2f;
        --text: #f9edff;
        --soft: #d9bcf7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 16px;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 149, 67, 0.2), transparent 36%),
          radial-gradient(circle at 85% 88%, rgba(196, 86, 255, 0.24), transparent 40%),
          linear-gradient(155deg, var(--bg-2), var(--bg-1) 54%, #080112 100%);
        min-height: 100vh;
        min-height: 100dvh;
      }

      .splash {
        width: min(92vw, 480px);
        padding: 0;
        text-align: center;
      }

      .logo-wrap {
        overflow: hidden;
      }

      .logo-wrap img,
      .logo-wrap video {
        width: 100%;
        height: min(65vh, 420px);
        object-fit: contain;
        display: block;
        mix-blend-mode: lighten;
        animation: glowPulse 2.4s ease-in-out infinite;
      }

      @keyframes glowPulse {
        0% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.07);
        }
        100% {
          filter: brightness(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-wrap img,
        .logo-wrap video {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="splash" aria-label="Cargando Parchar" aria-busy="true">
      <div class="logo-wrap">
        <img data-brand-logo src="/assets/parchar-logo-home.png" alt="Parchar" />
      </div>

    </main>

    <script src="/brand.js?v=94"></script>
    <script>
      async function checkServer() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
          const response = await fetch("/api/health", {
            cache: "no-store",
            signal: controller.signal,
          });

          if (response.ok && response.headers.get("content-type")?.includes("application/json")) {
            window.location.replace("/index.html");
            return;
          }
        } catch (error) {
          // no-op
        } finally {
          clearTimeout(timeout);
        }

        setTimeout(checkServer, 2200);
      }

      checkServer();
    </script>
  </body>
</html>
